title: Credential Harvesting from Windows Sticky Notes Database via PowerShell
id: 7a91b4c2-1101-4e8a-9c51-b006e7000003
status: experimental
description: Detects PowerShell commands enumerating or querying the Windows Sticky Notes SQLite database (plum.sqlite).
author: Tyrone Gabriel Pascual
date: 2026-11-05
tags:
  - attack.credential_access
  - attack.t1552.001
logsource:
  product: windows
  category: ps_script
detection:
  selection:
    ScriptBlockText|contains:
      - 'Microsoft.MicrosoftStickyNotes'
      - 'plum.sqlite'
      - 'SELECT * from NOTE'
  condition: selection
falsepositives:
  - Legitimate forensic or backup scripts inspecting user AppData packages.
level: high
